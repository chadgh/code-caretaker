# =============================================================================
# agent_loop.example.toml — annotated reference configuration
# =============================================================================
#
# Copy this file to `agent_loop.toml` and edit it:
#
#     cp agent_loop.example.toml agent_loop.toml
#
# The loop wakes up on an interval, walks the [[step]] tables below IN ORDER,
# and dispatches a single Claude Code session for the FIRST step that finds
# work. Then it sleeps and repeats. Order is priority: put the things you most
# want fixed first.
#
# Config file resolution order:
#   1. the --config flag
#   2. $AGENT_LOOP_CONFIG
#   3. ./agent_loop.toml at the repo root
#   4. built-in defaults (failing_prs, dependabot_alerts, prod_errors,
#      labeled_issues) if none of the above exist
#
# The loop shells out to `claude`, `gh`, `git`, and — for the prod_errors step
# — `ssh`. All of them must be on PATH and already authenticated.


# -----------------------------------------------------------------------------
# [loop] — global settings
# -----------------------------------------------------------------------------
# Every key here is optional; the value shown is the built-in default. Each can
# also be overridden by an environment variable, which wins over this file:
#
#   repo                    REPO
#   check_interval_seconds  CHECK_INTERVAL_SECONDS
#   token_sleep_seconds     TOKEN_SLEEP_SECONDS
#   claude_timeout_seconds  CLAUDE_TIMEOUT_SECONDS
#   status_file             AGENT_STATUS_FILE
#
[loop]

# The GitHub repository the loop operates on, as "owner/name". This is passed
# to `gh` and interpolated into prompts as {repo}.
repo = "your-org/your-repo"

# Seconds to sleep between cycles. 300 = check for work every five minutes.
check_interval_seconds = 300

# Seconds to sleep when Claude usage limits are exhausted. The loop backs off
# for this long instead of burning cycles that cannot dispatch. 3600 = an hour.
token_sleep_seconds = 3600

# Hard timeout for a single dispatched Claude session, in seconds. A session
# that runs longer is killed and the cycle moves on. 1800 = 30 minutes.
claude_timeout_seconds = 1800

# Append-only JSONL feed of what the loop did — one event per line. Relative
# paths are resolved against the repo root. Tail it to watch the loop:
#   tail -f .agent-status/events.jsonl
status_file = ".agent-status/events.jsonl"


# =============================================================================
# [[step]] tables
# =============================================================================
#
# Keys accepted by EVERY step, regardless of type:
#
#   type          (required) which step implementation to run. One of:
#                 "failing_prs", "dependabot_alerts", "prod_errors",
#                 "labeled_issues", "command".
#   name          label shown in logs and the status feed. Defaults to `type`.
#                 Give steps distinct names if you use a type more than once.
#   enabled       set false to skip the step entirely. Default true.
#   max_open_prs  skip this step while more than N pull requests are open.
#                 Default: no cap. Use it to stop the loop piling up review
#                 work faster than a human can merge it.
#   prompt        replace the step's built-in prompt template.
#
# About `prompt`: it is a Python str.format-style template, validated at
# startup. `{placeholder}` fields are substituted; a literal brace must be
# doubled as `{{` or `}}`. Using a placeholder a step does not provide is a
# startup error, so a typo fails fast instead of at 3am. Each step type's
# available placeholders are listed with it below.


# -----------------------------------------------------------------------------
# failing_prs — repair open PRs that are red
# -----------------------------------------------------------------------------
# Finds the first open PR with a failing/cancelled CI check or a merge conflict
# against its base branch, and dispatches a session to fix it. The session
# pushes to the EXISTING branch and never opens a new PR, so this step does not
# add to the open-PR count — which is why it usually goes first and usually
# carries no max_open_prs cap.
#
# Params: none.
# Prompt placeholders: {repo} {pr_number} {pr_title} {pr_branch} {problems}
[[step]]
type = "failing_prs"


# -----------------------------------------------------------------------------
# dependabot_alerts — batch-resolve security alerts
# -----------------------------------------------------------------------------
# Reads open Dependabot alerts via the GitHub API and dispatches one session to
# resolve all of them in a single batch PR. Skips itself when an open PR
# already looks like a Dependabot PR (title contains "dependabot", or the head
# branch starts with "dependabot/"), so it will not open a second one.
#
# NOTE: the built-in prompt names npm workspaces and `npm run typecheck`. For a
# non-npm project, override `prompt` with your own build/test commands.
#
# Params: none.
# Prompt placeholders: {repo} {count} {alerts}
[[step]]
type = "dependabot_alerts"
# prompt = """
# You are an autonomous agent working on {repo}.
# There are {count} open Dependabot security alert(s):
# {alerts}
# Update the affected dependencies, run the test suite, and open a single PR
# targeting the main branch.
# """


# -----------------------------------------------------------------------------
# prod_errors — triage production errors over SSH
# -----------------------------------------------------------------------------
# SSHes to a host and reads `journalctl` for a systemd unit at priority=err. If
# anything comes back, it dispatches a session to decide whether the errors are
# a code bug (fix it, open a PR) or infrastructure/transient (explain, no PR).
# It also emits a notifying "prod_errors" event to the status feed before
# dispatching, so you hear about production problems even if the session fails.
#
# Disabled here because it is deployment-specific — enable it and fill in your
# own host and unit. It requires passwordless SSH (BatchMode) to the host.
#
# Params:
#   ssh_host   host to connect to               (default "class-cash.chaggie.com")
#   ssh_user   user to connect as               (default "chadgh")
#   service    systemd unit to read             (default "class-cash-api.service")
#   lookback   journalctl --since value         (default "5 minutes ago")
# Prompt placeholders: {repo} {logs} {lookback} {service}
#
# The defaults are inherited from the project this loop was extracted from, so
# always set all four explicitly rather than relying on them.
[[step]]
type = "prod_errors"
enabled = false
ssh_host = "app.example.com"
ssh_user = "deploy"
service = "your-api.service"
lookback = "5 minutes ago"


# -----------------------------------------------------------------------------
# labeled_issues — implement an issue and open a PR
# -----------------------------------------------------------------------------
# Lists open issues carrying `label`, picks the first one that does not already
# have an open PR referencing it, and dispatches a session to implement it and
# open a PR. This is the step that creates new work for reviewers, so it is the
# usual place for a max_open_prs cap.
#
# "Already has a PR" is a heuristic: an open PR whose body or title contains
# "#<number>", or whose head branch name contains the issue number.
#
# Params:
#   label   issue label to look for   (default "for-agent")
#   limit   max issues to fetch       (default 50)
# Prompt placeholders: {repo} {issue_number} {issue_title} {issue_body}
[[step]]
type = "labeled_issues"
label = "for-agent"
max_open_prs = 3


# -----------------------------------------------------------------------------
# command — the no-code escape hatch
# -----------------------------------------------------------------------------
# Runs `check` through `sh -c` from the repo root. If it prints anything on
# stdout, that output becomes {output} in `prompt` and a session is dispatched.
# If it prints nothing (or exits non-zero with no output, or times out), the
# step finds no work and the loop falls through to the next one.
#
# This is how you try a new kind of step without writing any Go. If it earns
# its keep, promote it to a real step type.
#
# Params:
#   check    (required) shell command; its stdout gates the step
#   timeout  seconds before the check command is killed  (default 30)
#   model    value passed to `claude --model` for this step's session; omit to
#           use the CLI default. e.g. "sonnet", "opus", "haiku"
# Prompt placeholders: {repo} {output}
#
# `prompt` is REQUIRED for a command step — there is no built-in default.
#
# Two things to watch for:
#   * Only stdout counts. A command that always prints something (a header, a
#     "0 results" line) will dispatch a session every single cycle.
#   * Exit status is ignored, so `grep` finding nothing is fine — it prints
#     nothing and the step is simply skipped.
[[step]]
type = "command"
name = "stale-branches"
enabled = false
timeout = 30
# model = "sonnet"
check = "git branch -r --merged origin/main | grep -v main"
prompt = """
You are an autonomous agent working on {repo}.

These remote branches are merged into main and appear stale:

{output}

Verify each one is truly merged, then delete it from the remote.
"""

# A second command step, showing how to make a check stay quiet unless there is
# real work. `gh issue list` prints nothing when nothing matches, but many
# commands are chattier — wrap those so the step only speaks up when it should.
[[step]]
type = "command"
name = "refine-issues"
enabled = false
check = """
    output=$(gh issue list --search "no:assignee state:open label:needs-refinement" -L 1 --json number,title,body);
    [ "$output" != "[]" ] && echo "$output"
"""
prompt = """
You are the product manager for {repo}. The following issue needs refinement:

{output}

Read the issue, research the codebase, and either (a) comment with a concrete
implementation plan and any open questions, or (b) if the plan is already
settled, replace the needs-refinement label with for-agent or for-human.
"""
